services:
  faf-analyzer:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      FRIENDS_CONFIG_PATH: /config/friends.json
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-60}
    volumes:
      - ${REPLAY_PATH:-./replays}:/replays:ro
      - ./config:/config:ro
      - faf-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  faf-data:
